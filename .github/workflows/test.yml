name: research-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - run: nifty-pairs demo --out data/demo
      - run: nifty-pairs backtest --data data/demo --config configs/demo.json --out runs/demo
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: src/nifty_pairs/web
      - run: npm test
        working-directory: src/nifty_pairs/web
